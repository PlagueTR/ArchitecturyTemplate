org.gradle.jvmargs = -Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = false

# Build plugins
loom_version = 1.17-SNAPSHOT
architectury_plugin_version = 3.5-SNAPSHOT
shadow_version = 9.6.1
github_release_version = 2.5.2
curseforge_gradle_version = 1.3.33
commonmark_version = 0.32.0

# Mod properties
mod_id = example_mod
mod_name = Mod Name
mod_description = Mod description!
mod_author = Me
mod_sources = https://github.com/Me/example_mod
mod_license = All Rights Reserved
mod_version = 1.0.0

# client, server or both
mod_environment = client

maven_group = com.example
archives_name = example_mod

# Loaders
fabric_loader_version = 0.20.1

# Build target
target_minecraft_version = 1.21.1
enabled_platforms = fabric,forge,neoforge

# Optional dependencies
include_architectury_api = false

# Publishing
release_type = release

repo_owner = Me
repo_name = example_mod
repo_branch = main

modrinth_id = modrinth_id
curseforge_id = 0
